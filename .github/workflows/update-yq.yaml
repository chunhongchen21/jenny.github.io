name: Test yq read file
on:
  push:
    branches:
      - main
jobs:
  read-config:
    name: Read file
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read-config.outputs.matrix }}
    steps:
      - name: Install yq
        run: |
          sudo -E apt-get update -y
          sudo -E apt-get install -y wget
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read and parse deps-output1.yaml
        id: read-config
        run: |-
          ls
          content=$(cat deps-output1.yaml)
          yq --version
          json=$(echo "$content" | yq eval -o=json)
          echo "JSON content: $json"
          MATRIX=$(yq e -o=json '[.[] | {"chart-name": .name, "repo-url": .repoUrl, "helm-repo-name": .repoName, "target-version": .version}]' deps-output1.yaml)
          matrix_escaped=$(echo "$MATRIX" | jq -c .)
          echo "matrix=$matrix_escaped" >> "$GITHUB_OUTPUT"
  test:
    name: test
    runs-on: ubuntu-latest
    needs: read-config
    outputs:
      chart-name: ${{ steps.test.outputs.charts }}
    steps:
        - name: Use test
          id: test
          run: |
            echo ${{ fromJson(needs.read-config.outputs.matrix) }}
            matrix='${{ needs.read-config.outputs.matrix }}'
            chart_names=$(echo "$matrix" | yq e '.[].chart-name' -)
  
            echo "charts=[$chart_names]" >> "$GITHUB_OUTPUT"

  push-helmchart:
    name: Push Helm Charts
    runs-on: ubuntu-latest
    needs: read-config
    environment:
        name: ${{ inputs.environment-name || 'dev'}}
    strategy:
        matrix: 
            include: ${{ fromJson(needs.read-config.outputs.matrix) }}

    steps:
        - name: Use matrix configuration
          run: |
            echo "Chart Name: ${{ matrix.chart-name }}"
            echo "Repo URL: ${{ matrix.repo-url }}"
            echo "Helm Repo Name: ${{ matrix.helm-repo-name }}"
            echo "Target Version: ${{ matrix.target-version }}"
