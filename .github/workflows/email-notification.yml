name: Email Notification

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:

  job1:
    uses: ./.github/workflows/black.yml
# chunhongchen21/jenny.github.io/.github/workflows/black.yml@v1
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - run: echo ${{needs.build.outputs.output1}} ${{needs.build.outputs.output2}}
      
  example-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check triggering workflow
        run: |
           echo "Triggered by: $GITHUB_ENV"
      
      - name: Get previous workflow run status
        id: get-status
        run: |
          # Get the previous workflow run number
          PREVIOUS_RUN=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/chunhongchen21/jenny.github.io/actions/workflows/CI/runs?event=workflow_run" \
            | jq -r '.workflow_runs[1].id')
          
          # Get the status of the previous workflow run
          STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/chunhongchen21/jenny.github.io/actions/runs/$PREVIOUS_RUN" \
            | jq -r '.status')
          
          echo "::set-output name=status::$STATUS"
        shell: bash

      - name: Notify based on previous status
        run: |
          PREVIOUS_STATUS="${{ steps.get-status.outputs.status }}"
          if [ "$PREVIOUS_STATUS" = "success" ]; then
            echo "The previous workflow was successful! Send a notification."
          elif [ "$PREVIOUS_STATUS" = "failure" ]; then
            echo "The previous workflow failed! Send a notification."
          elif [ "$PREVIOUS_STATUS" = "cancelled" ]; then
            echo "The previous workflow was cancelled! Send a notification."
          else
            echo "Unknown status: $PREVIOUS_STATUS"
          fi
