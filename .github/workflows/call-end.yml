name: Call a reusable workflow and use its outputs

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      repository:
        value: ${{ jobs.job3.outputs.repository }}

jobs:
  job1:
    uses: ./.github/workflows/caller.yml
    with:
      smtp_username: ${{secrets.SMTP_USERNAME}}
  job3:
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.test.outputs.repository }}
    steps:
      - name: test
        id: test
        run: |-
          X_REPOSITORY = abcd
          echo "repository=${X_REPOSITORY}" >> "$GITHUB_OUTPUT"

  test-job:
    runs-on: ubuntu-latest
    needs: [job3]
    steps:
      - run: |
          echo ${{ needs.job3.outputs.repository }}

  job2:
    runs-on: ubuntu-latest

    needs: job1
    if: success() && true
    steps:
      - run: |
          echo ${{ secrets.SMTP_USERNAME }}
          echo ${GITHUB_WORKFLOW}
          echo ${{ needs.job1.outputs.firstword }} ${{ needs.job1.outputs.secondword }}
          echo ${{ needs.job1.outputs.name }} run completed with status ${{ needs.job1.outputs.status }}
