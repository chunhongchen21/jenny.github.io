name: Call a reusable workflow and use its outputs

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      firstword:
        description: "The first output string"
        value: ${{ jobs.job3.outputs.output1 }}
      secondword:
        description: "The second output string"
        value: ${{ jobs.job3.outputs.output2 }}
      repository:
        value: ${{ jobs.job3.outputs.repository }}

jobs:
  # job1:
  #   uses: ./.github/workflows/caller.yml
  #   with:
  #     smtp_username: ${{secrets.SMTP_USERNAME}}
  job3:
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.test.outputs.repository }}
      output1: ${{ steps.step1.outputs.firstword }}
      output2: ${{ steps.step2.outputs.secondword }}
    steps:
      - id: step1
        run: echo "firstword=hello" >> $GITHUB_OUTPUT
      - id: step2
        run: echo "secondword=world" >> $GITHUB_OUTPUT
      # - name: test
      #   id: test
      #   run: |
      #     X_REPOSITORY = abcd
      #     echo "repository=$X_REPOSITORY" >> $GITHUB_OUTPUT

  test-job:
    runs-on: ubuntu-latest
    needs: [job3]
    steps:
      - run: |
          echo ${{ needs.job3.outputs.repository }}

